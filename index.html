const cell=(dt,lab)=>{const k=iso(dt);return`<div class="day ${k==today?'td':''}" ondragover="event.preventDefault()" ondrop="drop(event,'${k}')"><b>${lab}</b><button class="add" onclick="addPost('${k}')">+</button>${P.filter(p=>p.date==k).map(chip).join('')}</div>`};
let body;if(V.mode=='month'){const off=(new Date(y,m,1).getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),tot=Math.ceil((off+nd)/7)*7;body=`<div class="cal">${['Mon','Tue','Wed','Thu','Fri'].map(x=>`<div class="dh">${x}</div>`).join('')}${Array.from({length:tot},(_,i)=>i).filter(i=>i%7<5).map(i=>{const dd=i-off+1;return dd<1||dd>nd?'<div class="day off"></div>':cell(new Date(y,m,dd),dd)}).join('')}</div>`}
else if(V.mode=='week'){const s=new Date(d);s.setDate(d.getDate()-(d.getDay()+6)%7);body=`<div class="wk"><div class="cal">${Array.from({length:5},(_,i)=>{const x=new Date(s);x.setDate(s.getDate()+i);return cell(x,['Mon','Tue','Wed','Thu','Fri'][i]+' '+x.getDate())}).join('')}</div></div>`}
else body=`<div class="card">${P.filter(p=>pd(p.date).getMonth()==m&&pd(p.date).getFullYear()==y).map(p=>`<div class="item" onclick="edit('${p.id}')"><div style="width:110px"><b>${pd(p.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</b><div style="color:var(--mut);font-size:12px">${p.time}</div></div><div style="flex:1"><b>${e(p.topic)}</b><div style="margin-top:3px">${tag(p.cat)}${st(p.status)}<span style="color:var(--mut);font-size:12px">${PL[p.plat]} · ${FM[p.fmt]} · ${p.owner}</span></div></div></div>`).join('')||'<p style="color:var(--mut)">No posts this month.</p>'}</div>`;
return`<div class="tool"><button class="btn" onclick="shift(-1)">‹</button><h2 style="min-width:0;font-size:26px">${V.mode=='week'?'Week of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}</h2><select onchange="V.d=new Date(${y},+this.value,1);render()">${MN.map((x,i)=>`<option value="${i}" ${i==m?'selected':''}>${x}</option>`).join('')}</select><select onchange="V.d=new Date(+this.value,${m},1);render()">${[2025,2026,2027,2028].map(x=>`<option ${x==y?'selected':''}>${x}</option>`).join('')}</select><button class="btn" onclick="shift(1)">›</button>${['month','week','list'].map(x=>`<button class="btn ${V.mode==x?'on':''}" onclick="V.mode='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}<span class="sp"></span><button class="btn pri" onclick="addPost('${iso(new Date(y,m,1))}')">+ New post</button><button class="btn" onclick="csv()">Export CSV</button><button class="btn" onclick="window.print()">Print</button></div>
<div class="tool"><input placeholder="Search posts…" value="${e(V.q)}" onchange="V.q=this.value;render()"><select onchange="V.c=this.value;render()"><option value="">All pillars</option>${Object.keys(CAT).map(c=>`<option value="${c}" ${V.c==c?'selected':''}>${CAT[c][0]}</option>`).join('')}</select><select onchange="V.pl=this.value;render()"><option value="">All platforms</option>${Object.keys(PL).map(c=>`<option value="${c}" ${V.pl==c?'selected':''}>${PL[c]}</option>`).join('')}</select><span style="font-size:12px;color:var(--mut)">Drag posts to move them. Gold outline = needs review.</span></div>${body}`}
function shift(k){const d=V.d;V.d=V.mode=='week'?new Date(d.getFullYear(),d.getMonth(),d.getDate()+7*k):new Date(d.getFullYear(),d.getMonth()+k,1);render()}
function drop(ev,k){ev.preventDefault();const p=byId(ev.dataTransfer.getData('t'));if(p){p.date=k;save();render()}}
function lib(){const q=(V.lq||'').toLowerCase(),L=LIB.map((x,i)=>({...x,i})).filter(x=>(!V.lc||x.cat==V.lc)&&(!V.lp||x.plat==V.lp)&&(!V.lf||x.fmt==V.lf)&&(!q||(x.topic+x.hook+x.desc).toLowerCase().includes(q)));
return`<div class="tool"><input placeholder="Search ${LIB.length} ideas…" value="${e(V.lq||'')}" onchange="V.lq=this.value;render()"><select onchange="V.lc=this.value;render()"><option value="">All pillars</option>${Object.keys(CAT).map(c=>`<option value="${c}" ${V.lc==c?'selected':''}>${CAT[c][0]}</option>`).join('')}</select><select onchange="V.lp=this.value;render()"><option value="">All platforms</option>${Object.keys(PL).map(c=>`<option value="${c}" ${V.lp==c?'selected':''}>${PL[c]}</option>`).join('')}</select><select onchange="V.lf=this.value;render()"><option value="">All formats</option>${Object.keys(FM).map(c=>`<option value="${c}" ${V.lf==c?'selected':''}>${FM[c]}</option>`).join('')}</select><span class="sp"></span><span style="color:var(--mut)">${L.length} ideas</span></div>
<div class="grid g3">${L.map(x=>`<div class="card">${tag(x.cat)}<h3 style="font-size:22px;margin:8px 0 4px">${x.topic}</h3><div style="font-style:italic;color:var(--navy)">“${x.hook}”</div><p style="font-size:13px;color:var(--mut)">${x.desc}</p><div class="row"><span>${PL[x.plat]} · ${FM[x.fmt]}</span><button class="btn" onclick="addLib(${x.i})">Add to calendar</button></div></div>`).join('')}</div>`}
function addLib(i){const x=LIB[i],y=V.d.getFullYear(),m=V.d.getMonth();open_(fill({date:wk(iso(new Date(y,m,1))),plat:x.plat,cat:x.cat,fmt:x.fmt,topic:x.topic,hook:x.hook,concept:x.desc+'.',time:'09:00',owner:'Team',status:'Idea'}),true)}
function addPost(d){open_(fill({date:wk(d),plat:'F',cat:'E',fmt:'C',topic:'',time:'09:00',owner:'Team',status:'Idea'}),true)}
function edit(id){open_({...byId(id)},false)}
const O=o=>Object.entries(o).map(([k,v])=>[k,v]);
const FL=[['date','Publication date','date'],['time','Publishing time','time'],['plat','Platform','s',O(PL)],['cat','Content pillar','s',Object.keys(CAT).map(k=>[k,CAT[k][0]])],['fmt','Format','s',O(FM)],['owner','Responsible','s',OW.map(x=>[x,x])],['status','Status','s',ST.map(x=>[x,x])],['topic','Post topic','w'],['hook','Hook','w'],['concept','Detailed post concept','t'],['visual','On-screen text / visual direction','t'],['caption','Suggested caption','t'],['tags','Hashtags','w'],['cta','Call to action','w'],['assets','Creative asset requirements','t'],['notes','Notes','t'],['feedback','Feedback from Tabitha &amp; Frank','t'],['reach','Reach'],['views','Views'],['comments','Comments'],['shares','Shares'],['saves','Saves'],['eng','Engagement rate %']];
function open_(p,isNew){V.ed={p,isNew,del:0};const m=document.createElement('div');m.className='mo';m.id='mo';m.onclick=ev=>{if(ev.target==m)closeM()};
m.innerHTML=`<div class="md"><h2 style="font-size:28px;margin-bottom:4px">${isNew?'New post':'Edit post'} <span style="font-size:14px;color:var(--mut)" id="dow"></span></h2><div class="fg">${FL.map(([k,l,t,o])=>`<div class="${t=='w'||t=='t'?'w':''}"><label>${l}</label>${t=='s'?`<select id="f_${k}">${o.map(([v,x])=>`<option value="${v}" ${p[k]==v?'selected':''}>${x}</option>`).join('')}</select>`:t=='t'?`<textarea id="f_${k}" rows="3">${e(p[k])}</textarea>`:`<input id="f_${k}" type="${t=='date'||t=='time'?t:'text'}" value="${e(p[k])}">`}</div>`).join('')}</div>
<div class="tool" style="margin-top:16px"><button class="btn pri" onclick="saveM()">Save</button><button class="btn" onclick="setS('Submitted for Review')">Submit for review</button><button class="btn" onclick="setS('Changes Requested')">Request changes</button><button class="btn" onclick="setS('Approved')">Approve</button><span class="sp"></span><button class="btn" onclick="cp(g('caption')+'\\n\\n'+g('tags'))">Copy caption + tags</button>${isNew?'':`<button class="btn" onclick="dup()">Duplicate</button><button class="btn" id="del" onclick="del()">Delete</button>`}<button class="btn" onclick="closeM()">Close</button></div></div>`;document.body.appendChild(m)}
const g=k=>$('#f_'+k).value,closeM=()=>{$('#mo')?.remove();V.ed=null};
function read(){const p=V.ed.p;FL.forEach(([k])=>p[k]=g(k));return p}
function setS(s){$('#f_status').value=s}
function saveM(){const p=read();if(!p.topic.trim()){toast('Add a topic first');return}if(p.date&&wk(p.date)!=p.date){p.date=wk(p.date);toast('Weekends stay free: moved to Monday')}if(V.ed.isNew)S.p.push(p);else Object.assign(byId(p.id),p);save();closeM();render()}
function dup(){const p=read();S.p.push({...p,id:uid(),topic:p.topic+' (copy)',status:'Idea'});save();closeM();render()}
function del(){if(!V.ed.del){V.ed.del=1;$('#del').textContent='Confirm delete?';return}S.p=S.p.filter(x=>x.id!=V.ed.p.id);save();closeM();render()}
document.addEventListener('keydown',ev=>{if(ev.key=='Escape')closeM()});
document.addEventListener('input',ev=>{if(ev.target.id=='f_date'&&ev.target.value)$('#dow').textContent=pd(ev.target.value).toLocaleDateString('en-US',{weekday:'long'})});
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}
function cp(t){try{navigator.clipboard.writeText(t).catch(()=>fb(t))}catch(x){fb(t)}toast('Copied')}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function csv(){const K=['date','time','plat','cat','fmt','topic','hook','caption','tags','cta','owner','status','notes','feedback','reach','views','comments','shares','saves','eng'];
const out=[K.join(',')].concat(vis().map(p=>K.map(k=>'"'+String(k=='plat'?PL[p[k]]:k=='cat'?CAT[p[k]][0]:k=='fmt'?FM[p[k]]:p[k]).replace(/"/g,'""')+'"').join(','))).join('\n');
const m=document.createElement('div');m.className='mo';m.id='mo';m.onclick=ev=>{if(ev.target==m)closeM()};m.innerHTML=`<div class="md"><h2 style="font-size:26px">Export CSV</h2><p style="color:var(--mut)">Copy this into a .csv file or paste it into Excel or Google Sheets.</p><textarea id="cv" rows="12" readonly>${e(out)}</textarea><div class="tool" style="margin-top:10px"><button class="btn pri" onclick="cp($('#cv').value)">Copy CSV</button><button class="btn" onclick="closeM()">Close</button></div></div>`;document.body.appendChild(m)}
render();
</script></body></html>
